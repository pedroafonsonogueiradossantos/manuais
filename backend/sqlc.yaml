version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          # O hash da senha nunca vai para uma resposta JSON.
          - column: usuario.senha_hash
            go_struct_tag: 'json:"-"'
