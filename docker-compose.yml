services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: manuais
      POSTGRES_PASSWORD: manuais
      POSTGRES_DB: manuais
    ports:
      # Só na máquina local; a senha acima é de desenvolvimento.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manuais -d manuais"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
